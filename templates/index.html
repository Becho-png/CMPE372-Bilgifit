<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BilgiFit — Log in</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="split">
    <!-- LEFT DARK PANEL -->
    <aside class="panel panel--dark">
      <div class="brand">
        <span class="brand__badge">B</span>
        <span class="brand__name">BilgiFit</span>
      </div>

      <div class="hero">
        <h1 class="hero__title" id="heroTitle">Welcome back to BilgiFit.</h1>
        <p class="hero__lede" id="heroLede">
          Use your Bilgi account to manage reservations, classes and trainer sessions.
        </p>
      </div>

      <div class="slot-card">
        <p class="slot-card__label">Next available gym slot</p>
        <p class="slot-card__value">Today / 17:00</p>
      </div>
    </aside>

    <!-- RIGHT FORM PANEL -->
    <section class="panel panel--light">
      <div class="form-wrap">
        <header class="form-head">
          <h2 class="form-head__title" id="formTitle">Log in</h2>
          <p class="form-head__sub" id="formSub">Continue with your campus credentials.</p>
        </header>

        <div class="tabs" role="tablist" aria-label="Auth tabs">
          <button class="tab tab--active" data-tab="login" role="tab" aria-selected="true">Login</button>
          <button class="tab" data-tab="register" role="tab" aria-selected="false">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" placeholder="zeynep@bilgi.edu.tr" autocomplete="email" />
            <p class="error" data-error-for="loginEmail"></p>
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="••••••" autocomplete="current-password" />
            <p class="error" data-error-for="loginPassword"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block">Log in</button>
          <a href="#" class="link-muted">Forgot password?</a>

          <p class="form-banner" id="loginBanner" hidden></p>
        </form>

        <!-- REGISTER FORM -->
        <form class="auth-form" id="registerForm" hidden novalidate>
          <div class="field">
            <label for="regName">Full name</label>
            <input type="text" id="regName" name="name" placeholder="Zeynep Yılmaz" autocomplete="name" />
            <p class="error" data-error-for="regName"></p>
          </div>

          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" placeholder="zeynep@bilgi.edu.tr" autocomplete="email" />
            <p class="error" data-error-for="regEmail"></p>
          </div>

          <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" autocomplete="new-password" />
            <p class="error" data-error-for="regPassword"></p>
          </div>

          <div class="field">
            <label for="regConfirm">Confirm password</label>
            <input type="password" id="regConfirm" name="confirm" placeholder="Re-enter password" autocomplete="new-password" />
            <p class="error" data-error-for="regConfirm"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block">Create account</button>

          <p class="form-banner" id="registerBanner" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
