<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BilgiFit - Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="page-dashboard">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__top">
        <div class="brand">
          <span class="brand__badge">B</span>
          <span class="brand__name">BilgiFit</span>
        </div>
        <p class="sidebar__caption">campus sports center</p>

        <nav class="nav" aria-label="Primary">
          <a href="#dashboard" class="nav__item nav__item--active" data-route="dashboard">Dashboard</a>
          <a href="#facility" class="nav__item" data-route="facility">Facility Booking</a>
          <a href="#sessions" class="nav__item" data-route="sessions">Group Sessions</a>
          <a href="#trainers" class="nav__item" data-route="trainers">Personal Trainers</a>
          <a href="#profile" class="nav__item" data-route="profile">My Profile</a>
        </nav>
      </div>

      <div class="occupancy-card">
        <p class="occupancy-card__label">Live occupancy</p>
        <p class="occupancy-card__value"><span id="liveOccupied">7</span> / <span id="liveCapacity">10</span></p>
      </div>
    </aside>

    <main class="main">
      <header class="main__header">
        <div>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <p class="page-sub" id="pageSub">Overview of your reservations and live facility state</p>
        </div>
        <div class="search">
          <input type="text" id="globalSearch" placeholder="Search facilities, sessions..." aria-label="Search" />
        </div>
      </header>

      <section id="content" class="content-shell" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal__title" id="modalTitle">Confirm Reservation</h2>
      <p class="modal__body" id="modalBody">Please confirm this booking.</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="cancelModalBtn">Cancel</button>
        <button type="button" class="btn btn--primary" id="confirmModalBtn">Confirm</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
